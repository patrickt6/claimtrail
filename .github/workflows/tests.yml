name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - name: Run the example end to end
        run: |
          pip install sympy
          cd examples/q-numbers && python run_example.py
      - name: Run the lending-review demo end to end
        run: python examples/lending-review/run_demo.py
